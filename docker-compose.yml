services:
  lucas2-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lucas2_mesai_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Istanbul
      - PYTHONUNBUFFERED=1
    volumes:
      # SQLite veritabanının sunucu kapansa/yeniden başlasa bile silinmemesi için kalıcı volume
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
