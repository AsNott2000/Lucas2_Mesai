name: CI/CD Pipeline - Docker Hub & SSH Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # GitHub arayüzünden manuel tetikleme

jobs:
  # -------------------------------------------------------------
  # 1. Aşama: Testler (CI)
  # -------------------------------------------------------------
  test:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Unit Tests
        run: |
          python -m unittest discover tests

  # -------------------------------------------------------------
  # 2. Aşama: Docker Hub'a İmaj Derleme & Push
  # -------------------------------------------------------------
  build-and-push:
    name: 🐳 Build & Push to Docker Hub
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Check out repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lucas2-mesai:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lucas2-mesai:${{ github.sha }}

  # -------------------------------------------------------------
  # 3. Aşama: Ubuntu Sunucusuna SSH ile Dağıtım (CD)
  # -------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to Ubuntu Server (SSH)
    needs: build-and-push
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 SSH Remote Commands & Pull from Docker Hub
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            echo "🚀 [1/5] Sunucu çalışma dizinine geçiliyor..."
            TARGET_DIR="${{ secrets.WORK_DIR || '/opt/Lucas2_Mesai' }}"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            echo "📥 [2/5] Git deposu kontrol ediliyor..."
            if [ -d ".git" ]; then
              echo "🔄 Git deposu güncelleniyor..."
              GIT_TERMINAL_PROMPT=0 git pull origin $(git branch --show-current 2>/dev/null || echo "main") || echo "⚠️ Git pull atlandı."
            fi

            echo "🔑 [3/5] Docker Hub'a giriş yapılıyor..."
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi

            echo "🐳 [4/5] Docker Hub'dan en güncel imaj çekiliyor..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/lucas2-mesai:latest

            echo "🔄 [5/5] Bot konteyneri güncelleniyor ve başlatılıyor..."
            DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/lucas2-mesai:latest docker compose up -d --remove-orphans

            echo "🧹 Eski imajlar temizleniyor..."
            docker image prune -f

            echo "✅ Dağıtım başarıyla tamamlandı!"
            docker compose ps
